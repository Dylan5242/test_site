<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <div class="container">

        <!-- ЛОГО СЛЕВА -->
        <div class="navbar-logo">
            <a href="index.html">
                <img src="logo.png" alt="Лого">
            </a>
        </div>

        <!-- МЕНЮ ДЛЯ ПК -->
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link active" href="about.html">О нас</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Портфолио</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Услуги</a></li>
            <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
        </ul>

        <!-- БУРГЕР ДЛЯ МОБИЛКИ -->
        <button class="burger" id="burgerBtn">
            <span class="line line1"></span>
            <span class="line line2"></span>
            <span class="line line3"></span>

            <!-- Крестик, скрытый по умолчанию -->
            <span class="burger-close">&#10060;</span>
        </button>
        <!--        <p>Закрыть: &#10060;</p>-->

    </div>

    <!-- ВЫПАДАЮЩЕЕ МЕНЮ ДЛЯ МОБИЛКИ -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">Главная</a>
        <a href="about.html">О нас</a>
        <a href="portfolio.html">Портфолио</a>
        <a href="services.html">Услуги</a>
        <a href="contacts.html">Контакты</a>
    </div>
</nav>

<script>
    const burgerBtn = document.getElementById('burgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    burgerBtn.addEventListener('click', () => {
        burgerBtn.classList.toggle('active');
        mobileMenu.classList.toggle('open');
    });
</script>
